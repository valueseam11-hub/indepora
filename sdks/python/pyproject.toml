[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "indepora-shadow"
version = "0.1.0"
description = "Experimental, non-blocking Python client for Indepora Stemcheck"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1.0"]
license = { text = "Apache-2.0" }
authors = [{ name = "Indepora" }]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
where = ["."]
include = ["indepora_shadow*"]
